# Temporary, branch-scoped migration generation workflow.
# Removed from the PR after the generated migration has been reviewed.
name: Scaffold initial DareCare SQL Server migration
on:
  push:
    branches: [darecare-sprint8-sqlserver-persistence]
permissions:
  contents: write
jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Scaffold initial SQL Server schema
        run: |
          set -euo pipefail
          if [ -d src/DareCare.Infrastructure/Persistence/Migrations ] && \
             find src/DareCare.Infrastructure/Persistence/Migrations -name '*InitialSqlServer.cs' | grep -q .; then
            echo "Migration already generated; nothing to do."
            exit 0
          fi
          dotnet tool restore
          dotnet ef migrations add InitialSqlServer \
            --project src/DareCare.Infrastructure \
            --startup-project src/DareCare.Api \
            --output-dir Persistence/Migrations
          test -f src/DareCare.Infrastructure/Persistence/Migrations/DareCareDbContextModelSnapshot.cs
      - name: Commit generated migration on the isolated feature branch
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- src/DareCare.Infrastructure/Persistence/Migrations)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/DareCare.Infrastructure/Persistence/Migrations
          git commit -m "Scaffold initial SQL Server EF Core migration"
          git push origin "HEAD:${GITHUB_REF_NAME}"
