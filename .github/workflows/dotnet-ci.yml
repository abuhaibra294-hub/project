name: DareCare .NET CI and API Contract Drift
on:
  push:
    branches: [main, darecare-demo-free]
  pull_request:
    branches: [main, darecare-demo-free]
permissions:
  contents: read
jobs:
  build-test-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Source-derived API contract consistency
        run: python3 scripts/generate_integration.py --check
      - run: dotnet restore DareCare.slnx
      - run: dotnet build DareCare.slnx --no-restore --configuration Release
      - run: dotnet test DareCare.slnx --no-build --configuration Release
      - name: Validate DareCare Lite JavaScript syntax
        run: node --check src/DareCare.Api/wwwroot/darecare-lite.js
      - name: Validate Admin portal JavaScript syntax
        run: node --check src/DareCare.Api/wwwroot/darecare-admin.js
  render-free-container-smoke:
    # Test the exact Render Docker image before merging into the demo branch too.
    if: github.ref == 'refs/heads/darecare-demo-free' || (github.event_name == 'pull_request' && github.base_ref == 'darecare-demo-free')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build exact Docker image used by Render
        run: docker build -t darecare-render-demo:ci .
      - name: Boot container using Dockerfile defaults and verify readiness
        shell: bash
        run: |
          set -euo pipefail
          # CI-only, synthetic one-time bootstrap. Never send this secret to Render.
          admin_pass="CI_Admin_Test!$(openssl rand -hex 18)Aa1"
          docker run --detach --name darecare-render-demo-ci \
            -p 127.0.0.1:18080:8080 \
            -e Jwt__Key="$(openssl rand -hex 48)" \
            -e BootstrapAdmin__AllowOneTimeStaging=true \
            -e BootstrapAdmin__Email=ci-admin@example.test \
            -e BootstrapAdmin__Password="$admin_pass" \
            darecare-render-demo:ci
          trap 'docker logs --tail 100 darecare-render-demo-ci; docker rm -f darecare-render-demo-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 45); do
            if curl --silent --fail http://127.0.0.1:18080/health/ready > /tmp/darecare-ready.json; then
              grep -q '"status":"ready"' /tmp/darecare-ready.json
              curl --silent --fail http://127.0.0.1:18080/openapi/v1.json > /dev/null
              # Verify the real container serves the same-origin frontend, not only the API.
              curl --silent --show-error --fail --dump-header /tmp/darecare-lite-headers.txt \
                http://127.0.0.1:18080/ > /tmp/darecare-lite.html
              grep -q 'DARECARE' /tmp/darecare-lite.html
              grep -qi 'content-security-policy:' /tmp/darecare-lite-headers.txt
              curl --silent --show-error --fail \
                http://127.0.0.1:18080/assets/darecare-lite.css > /tmp/darecare-lite.css
              grep -q 'root' /tmp/darecare-lite.css
              curl --silent --show-error --fail \
                http://127.0.0.1:18080/assets/darecare-lite.js > /tmp/darecare-lite.js
              grep -q 'DareCare Lite' /tmp/darecare-lite.js
              # A real admin alias is served by the same API, not an external frontend.
              curl --silent --show-error --fail --dump-header /tmp/darecare-admin-headers.txt \
                http://127.0.0.1:18080/admin > /tmp/darecare-admin.html
              grep -q 'id="adminLoginForm"' /tmp/darecare-admin.html
              grep -q 'darecare-admin.js' /tmp/darecare-admin.html
              grep -qi 'cache-control: no-store' /tmp/darecare-admin-headers.txt
              grep -qi 'content-security-policy:' /tmp/darecare-admin-headers.txt
              grep -qi 'x-robots-tag: noindex' /tmp/darecare-admin-headers.txt
              curl --silent --show-error --fail http://127.0.0.1:18080/admin/login > /tmp/darecare-admin-alias.html
              grep -q 'id="adminLoginForm"' /tmp/darecare-admin-alias.html
              curl --silent --show-error --fail \
                http://127.0.0.1:18080/assets/darecare-admin.css > /tmp/darecare-admin.css
              grep -q 'workspace' /tmp/darecare-admin.css
              curl --silent --show-error --fail \
                http://127.0.0.1:18080/assets/darecare-admin.js > /tmp/darecare-admin.js
              grep -q 'roles.includes' /tmp/darecare-admin.js
              test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
                http://127.0.0.1:18080/api/v1/admin/overview)" = 401
              # The Development-only auth lab must remain inaccessible in Staging.
              test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
                http://127.0.0.1:18080/auth.html)" = 404
              echo 'PASS: same-domain DareCare Lite homepage, CSS, JS and private dev lab restrictions.'
              python3 scripts/ci_http_smoke.py
              DARECARE_CI_ADMIN_EMAIL=ci-admin@example.test \
                DARECARE_CI_ADMIN_PASSWORD="$admin_pass" \
                python3 scripts/ci_onboarding_booking.py
              exit 0
            fi
            sleep 2
          done
          echo "DareCare did not become ready from Docker defaults." >&2
          exit 1
  deployed-lite-readonly:
    # The public service may auto-deploy after a merge; confirm actual runtime, not just GitHub.
    if: github.event_name == 'push' && github.ref == 'refs/heads/darecare-demo-free'
    needs: [render-free-container-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify existing Render domain serves UI and API without writing data
        run: python3 scripts/verify_lite_site.py --attempts 15 --interval 20
      - name: Verify new admin alias on the public Render service (GET-only)
        run: python3 scripts/verify_admin_live.py
  browser-lite-onboarding:
    # Browser DOM interactions are mocked; live backend writes remain loopback Docker only.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install headless browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser nurse/admin/patient actions and mobile overflow
        run: python scripts/ci_lite_browser.py
      - name: Admin alias role guard, dashboard actions and 390px browser QA
        run: python scripts/ci_admin_browser.py
      - name: Upload synthetic admin browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-portal-playwright
          path: artifacts/admin-*.png
          if-no-files-found: ignore
          retention-days: 7
