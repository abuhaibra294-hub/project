# DareCare FREE, DISPOSABLE demo (SYNTHETIC TEST DATA ONLY).
# No external database, SMTP or payment is needed for the initial API smoke test.
# Free Render has no persistent disk: accounts, bookings and uploaded test files
# vanish on restart, scale-down, rebuild or redeploy. NEVER use real patient data.
services:
  - type: web
    name: darecare-api-demo
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    envVars:
      - key: DOTNET_ENVIRONMENT
        value: Staging
      - key: ASPNETCORE_ENVIRONMENT
        value: Staging
      - key: ASPNETCORE_HTTP_PORTS
        value: "8080"
      - key: PORT
        value: "8080"
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: "true"
      - key: Database__Provider
        value: Sqlite
      - key: Demo__AllowStagingSqlite
        value: "true"
      - key: Storage__PrivateDirectory
        value: /tmp/darecare-demo/prescriptions
      - key: Auth__RequireConfirmedEmail
        value: "false"
      - key: ApiDocs__EnableInStaging
        value: "true"
      - key: Jwt__Issuer
        value: DareCare.Api
      - key: Jwt__Audience
        value: DareCare.Clients
      - key: Jwt__Key
        generateValue: true
